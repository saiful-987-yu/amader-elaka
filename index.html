    #app-splash { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--color-bg, #F3F5EF); color: var(--color-primary, #1F6E4A); pointer-events: none; opacity: 0; animation: splashIn 0.25s ease 0.5s forwards; }

    #app-splash__name strong { display: block; font-family: "Hind Siliguri", system-ui, sans-serif; font-size: 1.5rem; font-weight: 700; }
    #app-splash__name span { display: block; font-size: 0.9rem; opacity: 0.75; }
    @keyframes splashIn { to { opacity: 1; } }
    @keyframes splashLogo { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes splashName { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #app-splash__logo, #app-splash__name { animation: none; }
    }

  <script>
    (function () {
      var el = document.getElementById("app-splash");
      function drop() { if (el && el.parentNode) el.parentNode.removeChild(el); el = null; }
      window.hideSplash = function () {
        if (!el) return;
        var shown = parseFloat(window.getComputedStyle(el).opacity) || 0;
        if (shown < 0.05) { drop(); return; }
        el.style.animation = "none";
        el.style.opacity = String(shown);
        void el.offsetWidth;
        el.style.transition = "opacity 0.25s ease";
        el.style.opacity = "0";
        setTimeout(drop, 300);
      };
      setTimeout(window.hideSplash, 8000);
    })();
  </script>

  <script>
    // Small inline glue that doesn't warrant its own file:
    // brand/theme icon injection + footer year.
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".brand__mark").forEach(function (n) {
        // New brand logo — falls back to the old drawn icon (never a
        // broken-image icon, never a blank box) if the file is
        // missing or fails to load, exactly like every other image
        // fallback on this site.
        var img = document.createElement("img");
        img.src = "assets/brand/logo-low.png";
        img.alt = "";
        img.style.cssText = "width:100%;height:100%;object-fit:contain;border-radius:inherit;";
        img.onerror = function () { n.innerHTML = Icons.logo; };
        n.appendChild(img);
      });
      var themeIcon = document.querySelector("[data-theme-icon]");
      function paintThemeIcon() { themeIcon.innerHTML = Theme.current() === "dark" ? Icons.sun : Icons.moon; }
      paintThemeIcon();
      document.addEventListener("nobi:themechange", paintThemeIcon);
      var menuIcon = document.getElementById("menu-toggle");
      menuIcon.innerHTML = Icons.menu;

      // Mobile menu item icons — matched by href so icons.js stays the
      // single source of truth for the actual SVGs. The Profile item's
      // icon is a fixed starting point only; app.js's updateAuthNav()
      // replaces this whole link's content with an avatar + name once a
      // driver is actually logged in.
      var mobileNavIcons = {
        "#/": Icons.home,
        "#/registration": Icons.formPlus,
        "#/markets": Icons.car,
        "#/doctor": Icons.doctor,
        "#/login": Icons.user,
        "#/profile": Icons.user
      };
      document.querySelectorAll(".mobile-nav a").forEach(function (a) {
        var iconSpan = a.querySelector(".mobile-nav__icon");
        var svg = mobileNavIcons[a.getAttribute("href")];
        if (iconSpan && svg) iconSpan.innerHTML = svg;
      });
      var yearEl = document.querySelector("[data-year]");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Footer social links — icon + URL come from config/config.js
      // (SOCIAL_LINKS), so the owner can update just that file later.
      var socialNav = document.getElementById("footer-social");
      if (socialNav && window.NOBI_CONFIG && window.NOBI_CONFIG.SOCIAL_LINKS) {
        var platforms = [
          { key: "call", icon: Icons.phone, labelKey: "footer.call" },
          { key: "whatsapp", icon: Icons.whatsapp, labelKey: "footer.whatsapp" },
          { key: "facebook", icon: Icons.facebook, labelKey: "footer.facebook" },
          { key: "tiktok", icon: Icons.tiktok, labelKey: "footer.tiktok" },
          { key: "instagram", icon: Icons.instagram, labelKey: "footer.instagram" },
          { key: "website", icon: Icons.website, labelKey: "footer.website" }
        ];
        platforms.forEach(function (p) {
          var href = window.NOBI_CONFIG.SOCIAL_LINKS[p.key] || "#";
          // WhatsApp is configured as a plain phone number, not a URL —
          // reuse the same wa.me link builder as everywhere else on the
          // site (Utils.waLink) instead of a one-off implementation here.
          if (p.key === "whatsapp" && href !== "#") href = Utils.waLink(href);
          if (p.key === "call" && href !== "#") href = "tel:" + Utils.normalizePhone(href);
          var a = document.createElement("a");
          if (href !== "#") a.href = href;
          if (p.key !== "call" && href !== "#") {
            a.target = "_blank";
            a.rel = "noopener";
          }
          a.setAttribute("aria-label", Lang.t(p.labelKey));
          a.innerHTML = p.icon;
          if (p.key === "website") {
            a.className = "footer-social__brand";
            a.innerHTML = '<img src="assets/icons/sacarmart-logo.svg" alt="" width="20" height="20" decoding="async">';
          }
          socialNav.appendChild(a);
        });
      }
    });
  </script>
